name: Auto Test and Report

on:
  push:
    branches: [ "main", "master" ]
    # 避免由 bot 提交报告本身触发无限循环
    paths-ignore:
      - 'test_report.md'

jobs:
  run-tests:
    runs-on: windows-latest # 如果需要 Windows 环境或特定系统库，可选 windows-latest 或 ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # 指定你项目使用的 Python 版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if (Test-Path "requirements.txt") { pip install -r requirements.txt }

    - name: Run Python test script and generate report
      run: |
        # 运行你的测试脚本，并将输出重定向或直接在脚本内生成 test_report.md
        python xlsx2md.py
      continue-on-error: true # 即使测试失败也继续生成报告，让 Codex 分析错误原因

    - name: Commit and push test report back to repo
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add test_report.md
        # 检查是否有改动，有改动才提交
        git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update test report from GitHub Actions [skip ci]" && git push)