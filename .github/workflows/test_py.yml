name: Python Unit Tests

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "test_report.md"
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pytest:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pytest Pillow
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Run Pytest & Auto Generate Reports
        id: pytest
        shell: pwsh
        run: |
          python -m xlsx2md --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m pytest -v tests
        continue-on-error: true

      - name: Commit and push test report back to repo
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add test_report.md
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "auto: update test report from GitHub Actions [skip ci]"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            git push
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Fail workflow if unit tests failed
        if: steps.pytest.outcome == 'failure'
        shell: pwsh
        run: exit 1
